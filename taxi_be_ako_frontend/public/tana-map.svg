<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Main blue gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#036AA1"/>
    </linearGradient>

    <!-- Rova hill gradient -->
    <radialGradient id="hillGrad" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Subtle city grid - very light -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none">
    <!-- Main avenues -->
    <line x1="0" y1="300" x2="1920" y2="300" stroke-width="2"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke-width="2"/>
    <line x1="600" y1="0" x2="600" y2="1080" stroke-width="2"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke-width="2"/>
    <!-- Secondary streets -->
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="1080"/>
    <line x1="900" y1="0" x2="900" y2="1080"/>
    <line x1="1500" y1="0" x2="1500" y2="1080"/>
  </g>

  <!-- Rova hills - bottom right -->
  <ellipse cx="1550" cy="1050" rx="380" ry="180" fill="url(#hillGrad)"/>

  <!-- City blocks - subtle rectangles -->
  <g fill="rgba(255,255,255,0.04)" stroke="none">
    <rect x="100" y="100" width="200" height="100" rx="6"/>
    <rect x="400" y="180" width="180" height="120" rx="6"/>
    <rect x="700" y="120" width="220" height="160" rx="6"/>
    <rect x="1000" y="200" width="160" height="100" rx="6"/>
    <rect x="1300" y="150" width="200" height="140" rx="6"/>
    <rect x="1600" y="250" width="180" height="120" rx="6"/>
  </g>

  <!-- Central marker - Analakely/Ambohijatovo area -->
  <circle cx="960" cy="540" r="35" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
  <text x="960" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">TANA</text>

  <!-- Small decorative elements -->
  <circle cx="200" cy="300" r="8" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1720" cy="600" r="10" fill="rgba(255,255,255,0.08)"/>
</svg>